name = "2ffjc-blog"
compatibility_date = "2026-07-27"    #YYYY-MM-DD

[assets]
directory = "./dist"

[vars]
NODE_VERSION = "22"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1